name: Build & Verify Match

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mips-linux-gnu binutils-mips-linux-gnu make curl python3 python3-pip python3-venv openssl

      - name: Checkout encrypted baserom repository
        uses: actions/checkout@v4
        with:
          repository: 'dreamsailing59-ops/ijatim-private'
          token: ${{ secrets.BASEROM_REPO_TOKEN }}
          path: '.baserom_asset'

      - name: Decrypt baserom
        env:
          DECRYPT_PASS: ${{ secrets.ROM_DECRYPT_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 100000 \
            -in .baserom_asset/ijatim_base.z64.enc \
            -out ijatim_base.z64 \
            -pass pass:"$DECRYPT_PASS"
          rm -rf .baserom_asset

      - name: Set up Python virtual environment and splat
        run: |
          python3 -m venv .venv
          source .venv/bin/activate
          python3 -m pip install --upgrade pip
          python3 -m pip install -U "splat64[mips]"
          python3 -m pip install -U mapfile_parser

      - name: Split ROM with splat
        run: |
          source .venv/bin/activate
          python3 -m splat split indianajones.yaml

      - name: Build ROM
        run: |
          source .venv/bin/activate
          make -j$(nproc)
      - name: Generate Progress Report
        run: |
          source .venv/bin/activate
          python3 -m mapfile_parser objdiff_report --version us
      - name: Upload Progress Report
        uses: actions/upload-artifact@v4
        with:
          name: us_report
          path: build/progress.json